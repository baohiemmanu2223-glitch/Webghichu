function getMonthStart(date) {
  var d = new Date(date);
  d.setDate(1);
  return d;
}

function getMonthEnd(date) {
  var d = new Date(date.getFullYear(), date.getMonth() + 1, 0);
  return d;
}

function goToThisWeek() {
  currentMonthDate = new Date();
  renderTasksCalendar();
}

function changeWeek(direction) {
  currentMonthDate.setMonth(currentMonthDate.getMonth() + direction);
  renderTasksCalendar();
}

function formatDate(date) {
  var year = date.getFullYear();
  var month = String(date.getMonth() + 1).padStart(2, '0');
  var day = String(date.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}

function formatDateDisplay(date) {
  var day = String(date.getDate()).padStart(2, '0');
  var month = String(date.getMonth() + 1).padStart(2, '0');
  return day + '/' + month;
}

function getMonthName(date) {
  var months = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6',
                'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
  return months[date.getMonth()] + ' ' + date.getFullYear();
}

function renderTasksCalendar() {
  var container = document.getElementById('tasks-calendar');
  container.innerHTML = '';
  
  var monthStart = getMonthStart(currentMonthDate);
  var monthEnd = getMonthEnd(currentMonthDate);
  var monthStartStr = formatDate(monthStart);
  var monthEndStr = formatDate(monthEnd);

  // Lọc bỏ items đã bị xóa
  var activeTasks = filterDeletedItems(allTasks);
  var filteredTasks = searchTermTasks ? 
    filterItems(activeTasks, searchTermTasks) : 
    activeTasks;

  // SỬA: dùng filteredTasks thay vì allTasks
  var monthTasks = filteredTasks.filter(function(t) {
    return t.date >= monthStartStr && t.date <= monthEndStr;
  });

  var totalTasks = monthTasks.length;
  var completedTasks = monthTasks.filter(function(t) { return t.completed; }).length;
  var completionRate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

  var today = new Date();
  var next7Days = new Date(today);
  next7Days.setDate(today.getDate() + 7);
  var todayStr = formatDate(today);
  var next7DaysStr = formatDate(next7Days);

  // SỬA: dùng filteredTasks
  var upcomingTasks = filteredTasks.filter(function(t) {
    return t.date >= todayStr && t.date <= next7DaysStr && !t.completed;
  }).length;

  // Update header với stats
  document.getElementById('current-week-label').textContent = getMonthName(currentMonthDate);
  document.getElementById('stat-total').textContent = totalTasks;
  document.getElementById('stat-completed').textContent = completedTasks;
  document.getElementById('stat-rate').textContent = completionRate + '%';
  document.getElementById('stat-upcoming').textContent = upcomingTasks;
  
  var dayNames = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
  var today = formatDate(new Date());
  
  // Create header row for day names
  dayNames.forEach(function(dayName) {
    var headerCell = document.createElement('div');
    headerCell.className = 'calendar-day-header';
    headerCell.textContent = dayName;
    container.appendChild(headerCell);
  });
  
  // Start from first Monday before month start
  var startDate = new Date(monthStart);
  var dayOfWeek = startDate.getDay();
  var diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
  startDate.setDate(startDate.getDate() + diff);
  
  // Calculate total days to show (complete weeks)
  var endDate = new Date(monthEnd);
  var totalDays = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)) + 7;
  totalDays = Math.ceil(totalDays / 7) * 7; // Round to complete weeks
  
  for (var i = 0; i < totalDays; i++) {
    var currentDate = new Date(startDate);
    currentDate.setDate(currentDate.getDate() + i);
    var dateStr = formatDate(currentDate);
    
    var isCurrentMonth = currentDate.getMonth() === currentMonthDate.getMonth();
    
    var dayCell = document.createElement('div');
    dayCell.className = 'day-cell';
    if (dateStr === today) {
      dayCell.classList.add('today');
    }
    if (!isCurrentMonth) {
      dayCell.classList.add('other-month');
    }
    
    // Get ALL tasks for this date (including children)
    var allDayTasks = filteredTasks.filter(function(t) { return t.date === dateStr; });
    var taskCount = allDayTasks.length;
    var completedCount = allDayTasks.filter(function(t) { return t.completed; }).length;
    
    // Day header - HIỂN THỊ NGÀY VÀ SỐ LƯỢNG TASKS
    var header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = 
      '<div class="day-date">' + 
      formatDateDisplay(currentDate) + 
      // ← SỬA DÒNG NÀY
      (taskCount > 0 ? 
        (completedCount === taskCount ? 
          ' <span class="task-completed-icon"><i class="fas fa-check-circle"></i></span>' : 
          ' <span class="task-count">' + completedCount + '/' + taskCount + '</span>') 
        : '') +
      '</div>' +
      '<i class="fas fa-plus day-add-task" onclick="showAddTaskModalForDate(\'' + dateStr + '\')"></i>';
    
    dayCell.appendChild(header);
    
    // Tasks list
    var tasksList = document.createElement('div');
    tasksList.className = 'tasks-list';
    
    // Get root tasks for this date (level 0)
    var dayTasks = filteredTasks.filter(function(t) { 
      return t.date === dateStr && t.level === 0; 
    });
    dayTasks.sort(function(a, b) { return a.order - b.order; });
    
    dayTasks.forEach(function(task) {
      renderTaskItem(tasksList, task, dateStr);
    });
    
    dayCell.appendChild(tasksList);
    container.appendChild(dayCell);
  }
}

function renderTaskItem(container, task, dateStr) {
  var taskItem = document.createElement('div');
  taskItem.className = 'task-item level-' + task.level;
  if (task.completed) {
    taskItem.classList.add('completed');
  }

  taskItem.setAttribute('data-id', task.id);
  taskItem.setAttribute('draggable', 'true');
  
  // Check if task has children
  var children = allTasks.filter(function(t) { return t.parentId === task.id; });
  var hasChildren = children.length > 0;
  
  if (hasChildren) {
    taskItem.classList.add('has-children');
  }
  
  // ← THÊM: Toggle icon nếu có children
  var isExpanded = expandedTasks[task.id] === true;
  var toggleIcon = hasChildren ? 
    '<i class="fas fa-chevron-right task-toggle ' + (isExpanded ? 'expanded' : '') + '" onclick="toggleTaskChildren(event, \'' + task.id + '\')"></i>' : 
    '';
  
  taskItem.innerHTML = 
    '<input type="checkbox" class="task-checkbox" ' + 
    (task.completed ? 'checked' : '') + 
    ' onchange="toggleTaskComplete(\'' + task.id + '\')">' +
    toggleIcon +
    '<div class="task-title">' + escapeHtml(task.title) + '</div>' +
    '<div class="task-actions">' +
    (task.content ? '<i class="fas fa-eye" onclick="viewTaskContent(\'' + task.id + '\')"></i>' : '') +
    (hasChildren || task.level === 0 ? 
      '<i class="fas fa-plus" onclick="addChildTask(\'' + task.id + '\', \'' + dateStr + '\')"></i>' : '') +
    '<i class="fas fa-edit" onclick="editTask(\'' + task.id + '\')"></i>' +
    '<i class="fas fa-trash" onclick="deleteTaskConfirm(\'' + task.id + '\')"></i>' +
    '</div>';

  if (task.level <= 1) {
    var tooltipText = task.title;
    if (task.content) {
      var plainContent = task.content
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .substring(0, 150);
      tooltipText += '\n───────────────\n' + plainContent;
    }
    taskItem.setAttribute('data-tooltip', tooltipText);
  }
  
  container.appendChild(taskItem);
  
  // Render children
  if (children.length > 0) {
    children.sort(function(a, b) { return a.order - b.order; });
    
    var childrenContainer = document.createElement('div');
    var isExpanded = expandedTasks[task.id] === true;
    childrenContainer.className = isExpanded ? 'task-children' : 'task-children collapsed';
    childrenContainer.setAttribute('data-parent-id', task.id);
    
    children.forEach(function(child) {
      renderTaskItem(childrenContainer, child, dateStr);
    });
    
    container.appendChild(childrenContainer);
  }
}

function toggleTaskChildren(event, taskId) {
  event.stopPropagation();
  
  var childrenContainer = document.querySelector('.task-children[data-parent-id="' + taskId + '"]');
  var toggleIcon = event.target;
  
  if (childrenContainer) {
    if (childrenContainer.classList.contains('collapsed')) {
      // Expand
      childrenContainer.classList.remove('collapsed');
      toggleIcon.classList.add('expanded');
      expandedTasks[taskId] = true;
    } else {
      // Collapse
      childrenContainer.classList.add('collapsed');
      toggleIcon.classList.remove('expanded');
      delete expandedTasks[taskId];
    }
  }
}

function htmlToPlainText(html) {
  var temp = document.createElement('div');
  temp.innerHTML = html;
  return temp.textContent || temp.innerText || '';
}

function showAddTaskModal() {
  var today = new Date();
  showAddTaskModalForDate(formatDate(today));
}

function showAddTaskModalForDate(dateStr, parentId) {
  closeModal();
  
  var modal = document.getElementById('modal-task');
  var form = modal.querySelector('form');
  
  form.reset();
  form.removeAttribute('data-id');
  form.removeAttribute('data-parent-id');
  
  document.getElementById('task-date').value = dateStr;
  document.getElementById('task-content').innerHTML = '';
  
  // Set parentId if adding child
  if (parentId) {
    form.setAttribute('data-parent-id', parentId);
    modal.querySelector('.modal-title').textContent = 'Thêm Task con';
  } else {
    modal.querySelector('.modal-title').textContent = 'Thêm Task mới';
  }
  
  // Setup text formatting
  setupTextFormatting('task-content');
  
  modal.style.display = 'flex';
}

function addChildTask(parentId, dateStr) {
  showAddTaskModalForDate(dateStr, parentId);
}

function editTask(taskId) {
  var task = allTasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  
  var modal = document.getElementById('modal-task');
  var form = modal.querySelector('form');
  
  form.setAttribute('data-id', taskId);
  form.removeAttribute('data-parent-id');
  
  document.getElementById('task-date').value = task.date;
  document.getElementById('task-title').value = task.title;
  document.getElementById('task-content').innerHTML = markdownToHtml(task.content || '');
  document.getElementById('task-completed').checked = task.completed;
  
  // Setup text formatting
  setupTextFormatting('task-content');
  
  modal.querySelector('.modal-title').textContent = 'Sửa Task';
  modal.style.display = 'flex';
}

async function saveTask() {
  var form = document.getElementById('form-task');
  var itemId = form.getAttribute('data-id');
  var parentId = form.getAttribute('data-parent-id') || '';
  
  var date = document.getElementById('task-date').value;
  var title = document.getElementById('task-title').value.trim();
  var content = htmlToMarkdown(document.getElementById('task-content').innerHTML);
  var level = parentId ? 1 : 0;
  var completed = document.getElementById('task-completed').checked;
  
  if (!date || !title) {
    showNotification('Vui lòng nhập đầy đủ thông tin', 'error');
    return;
  }
  
  closeModal();
  
  if (itemId) {
    await updateItemOptimistic('tasks', itemId, {
      date: date,
      title: title,
      content: content,
      completed: completed
    });
  } else {
    // Tính order đúng cho Tasks
    var siblings;
    if (parentId) {
      // Task con: lấy order theo parentId
      siblings = allTasks.filter(function(t) {
        return t.parentId === parentId;
      });
    } else {
      // Task cha: lấy order theo DATE ← SỬA CHÍNH Ở ĐÂY
      siblings = allTasks.filter(function(t) {
        return t.date === date && t.parentId === '';
      });
    }
    
    var newOrder = siblings.length === 0 ? 1 : 
      Math.max.apply(null, siblings.map(function(s) { return s.order; })) + 1;
    
    var newTask = {
      id: 'T' + Date.now(),
      parentId: parentId,
      date: date,
      title: title,
      content: content,
      level: level,
      completed: completed,
      order: newOrder  // ← DÙNG newOrder thay vì getNextOrder
    };
    await createItemOptimistic('tasks', newTask);
  }
}

function viewTaskContent(taskId) {
  var task = allTasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  
  var modal = document.getElementById('modal-view-content');
  document.getElementById('view-content-title').textContent = task.title || 'Untitled';
  
  var contentHtml = markdownToHtml(task.content || 'Không có nội dung');
  // KHÔNG normalize khi render - sẽ xử lý khi click
  document.getElementById('view-content-text').innerHTML = contentHtml;
  
  // Store current viewing item for copy function
  modal.setAttribute('data-viewing-type', 'tasks');
  modal.setAttribute('data-viewing-id', taskId);
  
  modal.style.display = 'flex';
}

async function toggleTaskComplete(taskId) {
  var task = allTasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  
  task.completed = !task.completed;
  renderTasksCalendar();
  
  await updateItemOptimistic('tasks', taskId, { completed: task.completed });
}

function deleteTaskConfirm(taskId) {
  if (confirm('Bạn có chắc chắn muốn xóa task này?')) {
    deleteItemOptimistic('tasks', taskId);
  }
}

// Global click to hide context menu
document.addEventListener('click', function() {
  document.getElementById('table-context-menu').style.display = 'none';
});
// Initialize app when DOM is ready
document.addEventListener('DOMContentLoaded', initializeApp);
</script>
