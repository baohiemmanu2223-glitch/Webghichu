<script>
// ===== GLOBAL VARIABLES =====
var allPrompts = [];
var allNotes = [];
var allAccounts = [];
var allTasks = [];
var currentMonthDate = new Date();
var currentTab = 'prompts';
var searchTermPrompts = '';
var searchTermNotes = '';
var searchTermAccounts = '';
var searchTermTasks = '';
var isLoading = false;
var currentTableCell = null;
var tableUndoHistory = [];
var draggedItem = null;
var draggedParentId = null;
var originalIndex = -1;
var expandedTasks = {};
var savedSelection = null;
var quickViewCollapsed = {}; // Quick View collapsed state
var appSettings = {}; // Settings data
var promptsViewMode = 'tree'; // View mode for Prompts: 'tree' | 'grid' | 'list'
var notesViewMode = 'tree'; // View mode for Notes: 'tree' | 'grid' | 'list'

// ===== DATA LOADING =====
function loadAllData() {
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.error) {
          reject(new Error(result.error));
          return;
        }
        
        // Update global data arrays
        allPrompts = result.prompts || [];
        allNotes = result.notes || [];
        allAccounts = result.accounts || [];
        allTasks = result.tasks || [];
        
        // Load settings
        loadSettings().then(function() {
          resolve();
        }).catch(function(err) {
          // If settings fail, continue anyway
          console.log('Settings load error:', err);
          resolve();
        });
      })
      .withFailureHandler(function(error) {
        reject(error);
      })
      .getAllData();
  });
}

// Load settings from backend
function loadSettings() {
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(settings) {
        appSettings = settings || {};
        applySettings();
        resolve();
      })
      .withFailureHandler(function(error) {
        reject(error);
      })
      .getSettings();
  });
}

// Apply settings to CSS variables
function applySettings() {
  var root = document.documentElement;
  
  // Apply background color
  if (appSettings['bg-main']) {
    root.style.setProperty('--bg-main', appSettings['bg-main']);
  }
  
  // Apply Level 0 settings
  if (appSettings['lv0-color']) {
    root.style.setProperty('--lv0-color', appSettings['lv0-color']);
  }
  if (appSettings['lv0-bg']) {
    root.style.setProperty('--lv0-bg', appSettings['lv0-bg']);
  }
  if (appSettings['lv0-border-width']) {
    root.style.setProperty('--lv0-border-width', appSettings['lv0-border-width'] + 'px');
  }
  if (appSettings['lv0-border-color']) {
    root.style.setProperty('--lv0-border-color', appSettings['lv0-border-color']);
  }
  
  // Apply Level 1 settings
  if (appSettings['lv1-color']) {
    root.style.setProperty('--lv1-color', appSettings['lv1-color']);
  }
  if (appSettings['lv1-bg']) {
    root.style.setProperty('--lv1-bg', appSettings['lv1-bg']);
  }
  if (appSettings['lv1-border-width']) {
    root.style.setProperty('--lv1-border-width', appSettings['lv1-border-width'] + 'px');
  }
  if (appSettings['lv1-border-color']) {
    root.style.setProperty('--lv1-border-color', appSettings['lv1-border-color']);
  }
  
  // Apply Level 2 settings
  if (appSettings['lv2-color']) {
    root.style.setProperty('--lv2-color', appSettings['lv2-color']);
  }
  if (appSettings['lv2-bg']) {
    root.style.setProperty('--lv2-bg', appSettings['lv2-bg']);
  }
  if (appSettings['lv2-border-width']) {
    root.style.setProperty('--lv2-border-width', appSettings['lv2-border-width'] + 'px');
  }
  if (appSettings['lv2-border-color']) {
    root.style.setProperty('--lv2-border-color', appSettings['lv2-border-color']);
  }
}

// ===== EVENT LISTENERS SETUP =====
function setupEventListeners() {
  // Tab switching
  document.getElementById('tab-prompts').addEventListener('click', function() { switchTab('prompts'); });
  document.getElementById('tab-notes').addEventListener('click', function() { switchTab('notes'); });
  document.getElementById('tab-accounts').addEventListener('click', function() { switchTab('accounts'); });
  document.getElementById('tab-tasks').addEventListener('click', function() { switchTab('tasks'); });
  document.getElementById('tab-recycle').addEventListener('click', function() { switchTab('recycle'); });
  document.getElementById('tab-settings').addEventListener('click', function() { switchTab('settings'); });
  
  // Add buttons
  document.getElementById('btn-add-prompt').addEventListener('click', function() { showAddModal('prompts'); });
  document.getElementById('btn-add-note').addEventListener('click', function() { showAddModal('notes'); });
  document.getElementById('btn-add-account').addEventListener('click', function() { showAddModal('accounts'); });
  document.getElementById('btn-add-task').addEventListener('click', function() { showAddTaskModal(); });
  
  // Search inputs
  var searchPrompts = document.getElementById('search-prompts');
  if (searchPrompts) {
    searchPrompts.addEventListener('input', function(e) {
      searchTermPrompts = e.target.value;
      renderPrompts();
    });
  }
  
  var searchNotes = document.getElementById('search-notes');
  if (searchNotes) {
    searchNotes.addEventListener('input', function(e) {
      searchTermNotes = e.target.value;
      renderNotes();
    });
  }
  
  var searchAccounts = document.getElementById('search-accounts');
  if (searchAccounts) {
    searchAccounts.addEventListener('input', function(e) {
      searchTermAccounts = e.target.value;
      renderAccounts();
    });
  }
  
  var searchTasks = document.getElementById('search-tasks');
  if (searchTasks) {
    searchTasks.addEventListener('input', function(e) {
      searchTermTasks = e.target.value;
      renderTasksCalendar();
    });
  }
  
  // Modal close buttons
  document.querySelectorAll('.modal-close').forEach(function(btn) {
    btn.addEventListener('click', closeModal);
  });
  
  // Modal cancel buttons
  document.querySelectorAll('.modal-cancel').forEach(function(btn) {
    btn.addEventListener('click', closeModal);
  });
  
  // Form save buttons
  document.getElementById('modal-save-prompt').addEventListener('click', savePrompt);
  document.getElementById('modal-save-note').addEventListener('click', saveNote);
  document.getElementById('modal-save-account').addEventListener('click', saveAccount);
  document.getElementById('modal-save-task').addEventListener('click', saveTask);
  
  // Table and image modals
  document.getElementById('btn-create-table').addEventListener('click', createTableFromModal);
  document.getElementById('btn-insert-images').addEventListener('click', insertImagesFromModal);
  document.getElementById('btn-add-more-images').addEventListener('click', addMoreImagesFromModal);
  
  // Confirm delete modal
  document.getElementById('btn-confirm-yes').addEventListener('click', function() { confirmDeleteImage(true); });
  document.getElementById('btn-confirm-no').addEventListener('click', function() { confirmDeleteImage(false); });
  
  // Settings buttons
  var btnSaveSettings = document.getElementById('btn-save-settings');
  if (btnSaveSettings) {
    btnSaveSettings.addEventListener('click', saveSettingsToBackend);
  }
  
  var btnResetSettings = document.getElementById('btn-reset-settings');
  if (btnResetSettings) {
    btnResetSettings.addEventListener('click', resetSettingsToDefault);
  }
  
  // Sync color pickers with text inputs
  syncColorInputs('setting-bg-main', 'setting-bg-main-text');
  syncColorInputs('setting-lv0-color', 'setting-lv0-color-text');
  syncColorInputs('setting-lv0-bg', 'setting-lv0-bg-text');
  syncColorInputs('setting-lv0-border-color', 'setting-lv0-border-color-text');
  syncColorInputs('setting-lv1-color', 'setting-lv1-color-text');
  syncColorInputs('setting-lv1-bg', 'setting-lv1-bg-text');
  syncColorInputs('setting-lv1-border-color', 'setting-lv1-border-color-text');
  syncColorInputs('setting-lv2-color', 'setting-lv2-color-text');
  syncColorInputs('setting-lv2-bg', 'setting-lv2-bg-text');
  syncColorInputs('setting-lv2-border-color', 'setting-lv2-border-color-text');
  
  // Close modal when clicking outside
  document.querySelectorAll('.modal').forEach(function(modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        closeModal();
      }
    });
  });
  
  // Setup drag and drop
  setupDragAndDrop();
  
  // Setup image click handlers
  setupImageClickHandlers();
}

// ===== VIEW MODE FUNCTIONS =====
function loadViewModes() {
  // Load from localStorage
  var savedPromptsMode = localStorage.getItem('promptsViewMode');
  var savedNotesMode = localStorage.getItem('notesViewMode');
  
  if (savedPromptsMode && ['tree', 'grid', 'list'].indexOf(savedPromptsMode) !== -1) {
    promptsViewMode = savedPromptsMode;
  }
  
  if (savedNotesMode && ['tree', 'grid', 'list'].indexOf(savedNotesMode) !== -1) {
    notesViewMode = savedNotesMode;
  }
}

function saveViewMode(type, mode) {
  if (type === 'prompts') {
    promptsViewMode = mode;
    localStorage.setItem('promptsViewMode', mode);
  } else if (type === 'notes') {
    notesViewMode = mode;
    localStorage.setItem('notesViewMode', mode);
  }
}

function setViewMode(type, mode) {
  saveViewMode(type, mode);
  updateViewModeButtons(type);
  if (type === 'prompts' && currentTab === 'prompts') {
    renderPrompts();
  } else if (type === 'notes' && currentTab === 'notes') {
    renderNotes();
  }
}

function updateViewModeButtons(type) {
  var mode = type === 'prompts' ? promptsViewMode : notesViewMode;
  var prefix = type === 'prompts' ? 'prompts' : 'notes';
  
  // Remove active class from all buttons
  document.querySelectorAll('.' + prefix + '-view-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });
  
  // Add active class to current mode button
  var activeBtn = document.getElementById(prefix + '-view-' + mode);
  if (activeBtn) {
    activeBtn.classList.add('active');
  }
}

// ===== INITIALIZATION =====
async function initializeApp() {
  showLoadingOverlay();
  try {
    loadViewModes();
    await loadAllData();
    setupEventListeners();
    switchTab('prompts');
  } catch (error) {
    showNotification('Lỗi khi tải dữ liệu: ' + error.message, 'error');
  } finally {
    hideLoadingOverlay();
  }
}

// Setup event delegation for image clicks - Xử lý TẠI THỜI ĐIỂM CLICK
// Chỉ normalize URL khi click, không normalize khi render HTML
function setupImageClickHandlers() {
  // Gắn event listener 1 lần duy nhất ở document.body để xử lý nội dung render động
  document.body.addEventListener('click', function(e) {
    var target = e.target;
    var urlToOpen = null;
    var isGoogleImage = false;
    
    // Xử lý click vào <img> tag
    if (target.tagName === 'IMG') {
      // Lấy URL từ data-url hoặc src
      urlToOpen = target.getAttribute('data-url') || target.src;
      
      // Kiểm tra nếu là Google image URL
      if (urlToOpen && urlToOpen.includes('lh3.googleusercontent.com')) {
        isGoogleImage = true;
      }
    }
    
    // Xử lý click vào <a> tag bao quanh ảnh
    if (target.tagName === 'A' && target.href) {
      urlToOpen = target.href;
      
      // Kiểm tra nếu là Google image URL
      if (urlToOpen.includes('lh3.googleusercontent.com')) {
        isGoogleImage = true;
      }
    }
    
    // Nếu là Google image URL → xử lý normalize và mở
    if (isGoogleImage && urlToOpen) {
      // Ngăn chặn hành vi mặc định của browser
      e.preventDefault();
      e.stopPropagation();
      
      // Normalize URL: xóa =sXXX (ví dụ: =s220, =s400, =s800)
      var cleanUrl = normalizeImageUrl(urlToOpen);
      
      // Mở URL đã được normalize trong tab mới
      window.open(cleanUrl, '_blank');
    }
    
    // Nếu không phải Google image → để browser xử lý bình thường (không làm gì)
  }, true); // Use capture phase để bắt sớm hơn
}

// ===== TAB SWITCHING =====
function switchTab(tabName) {
  currentTab = tabName;
  
  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });
  document.getElementById('tab-' + tabName).classList.add('active');
  
  // Update content visibility
  document.querySelectorAll('.tab-content').forEach(function(content) {
    content.classList.remove('active');
  });
  document.getElementById('content-' + tabName).classList.add('active');
  
  // Update add button visibility
  document.querySelectorAll('.add-btn').forEach(function(btn) {
    btn.style.display = 'none';
  });
  
  // For recycle and settings tabs: skip all add-button logic entirely (no DOM access to add buttons)
  if (tabName !== 'recycle' && tabName !== 'settings') {
    if (tabName === 'tasks') {
      var taskBtn = document.getElementById('btn-add-task');
      if (taskBtn) taskBtn.style.display = 'block';
    } else {
      var addId = 'btn-add-' + tabName.substring(0, tabName.length - 1);
      var addBtn = document.getElementById(addId);
      if (addBtn) addBtn.style.display = 'block';
    }
  }
  
  renderCurrentTab();
  
  // Update view mode buttons
  if (tabName === 'prompts') {
    updateViewModeButtons('prompts');
  } else if (tabName === 'notes') {
    updateViewModeButtons('notes');
  }
}

function renderCurrentTab() {
  if (currentTab === 'prompts') {
    renderPrompts();
  } else if (currentTab === 'notes') {
    renderNotes();
  } else if (currentTab === 'accounts') {
    renderAccounts();
  } else if (currentTab === 'tasks') {
    renderTasksCalendar();
  } else if (currentTab === 'recycle') {
    renderRecycleBin();
  } else if (currentTab === 'settings') {
    renderSettings();
  }
}

// ===== PROMPTS RENDERING (3-LEVEL STRUCTURE) =====
var collapsedPrompts = {}; // Store collapsed state for Level 0

// Normalize Google Image URL - Remove resize parameter =sXXX
function normalizeGoogleImageUrl(url) {
  if (!url) return url;
  if (!url.includes('lh3.googleusercontent.com')) return url;
  // Remove =s\d+ pattern (e.g., =s220, =s400, =s500) but keep query parameters
  // Pattern: =s followed by digits, before ? or end of string
  return url.replace(/=s\d+/g, '');
}

// Normalize Google image URLs in HTML content
function normalizeGoogleImageUrlsInHtml(html) {
  if (!html) return html;
  
  // Create a temporary div to parse HTML
  var temp = document.createElement('div');
  temp.innerHTML = html;
  
  // Process all img tags
  temp.querySelectorAll('img').forEach(function(img) {
    if (img.src && img.src.includes('lh3.googleusercontent.com')) {
      img.src = normalizeGoogleImageUrl(img.src);
      if (img.getAttribute('data-url')) {
        img.setAttribute('data-url', normalizeGoogleImageUrl(img.getAttribute('data-url')));
      }
    }
  });
  
  // Process all anchor tags
  temp.querySelectorAll('a').forEach(function(a) {
    if (a.href && a.href.includes('lh3.googleusercontent.com')) {
      a.href = normalizeGoogleImageUrl(a.href);
    }
  });
  
  return temp.innerHTML;
}

// ================= IMAGE HANDLING HELPERS =================
// Fallback image when original fails
var IMAGE_FALLBACK_URL = 'https://via.placeholder.com/600x400?text=Image+Unavailable';

// Normalize a variety of image URLs (Google Drive, lh3, drive uc). Return better-loading URL when possible.
function normalizeImageUrl(url) {
  if (!url) return url;
  url = url.trim();

  // If already lh3 -> remove size params
  if (url.includes('lh3.googleusercontent.com')) {
    return url.replace(/=s\d+/g, '');
  }

  // Google Drive formats: /d/FILE_ID or id=FILE_ID
  var m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m && m[1]) {
    // Convert to lh3-style host for faster delivery (best-effort)
    return 'https://lh3.googleusercontent.com/d/' + m[1];
  }

  // drive.google.com/uc?export=view&id=ID
  var m2 = url.match(/uc\?export=view&id=([a-zA-Z0-9_-]+)/);
  if (m2 && m2[1]) {
    return 'https://lh3.googleusercontent.com/d/' + m2[1];
  }

  // Otherwise return original URL (Imgur, Cloudinary, etc.)
  return url;
}

// Error handler with retry and fallback
function handleImageError(img) {
  try {
    var retries = parseInt(img.getAttribute('data-retries') || '0', 10);
    if (retries < 2) {
      img.setAttribute('data-retries', retries + 1);
      var src = img.getAttribute('data-src') || img.getAttribute('data-original-src') || img.src;
      img.src = src + (src.indexOf('?') === -1 ? '?' : '&') + 'cb=' + Date.now();
      return;
    }
  } catch (e) {}

  img.onerror = null;
  img.src = IMAGE_FALLBACK_URL;
  img.classList.add('img-error');
}

// Lazy load images using IntersectionObserver; observes images with data-src
function setupLazyLoadImages() {
  var lazyImages = Array.prototype.slice.call(document.querySelectorAll('img[data-src]'));
  if (lazyImages.length === 0) return;

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries, observer) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var img = entry.target;
          var src = img.getAttribute('data-src');
          if (src) {
            img.onload = function() { img.classList.add('loaded'); };
            img.onerror = function() { handleImageError(img); };
            img.src = src;
          }
          observer.unobserve(img);
        }
      });
    }, {rootMargin: '200px 0px'});

    lazyImages.forEach(function(img) { io.observe(img); });
  } else {
    // Fallback: load immediately
    lazyImages.forEach(function(img) {
      var src = img.getAttribute('data-src');
      if (src) {
        img.onerror = function() { handleImageError(img); };
        img.src = src;
      }
    });
  }
}

// Helper to transform HTML content: normalize image URLs and set up data-src + lazy attributes
function processImagesInHtml(html) {
  if (!html) return html;
  var temp = document.createElement('div');
  temp.innerHTML = html;

  temp.querySelectorAll('img').forEach(function(img) {
    var original = img.getAttribute('data-url') || img.getAttribute('src') || '';
    var normalized = normalizeImageUrl(original) || original;

    // Preserve original
    if (original) img.setAttribute('data-original-src', original);

    img.setAttribute('data-src', normalized);
    img.setAttribute('data-url', normalized);
    img.setAttribute('loading', 'lazy');

    // Use a tiny transparent placeholder to avoid immediate load
    img.setAttribute('src', 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==');

    // Ensure onerror calls our handler
    img.setAttribute('onerror', 'this.onerror=null;handleImageError(this);');
  });

  temp.querySelectorAll('a').forEach(function(a) {
    var href = a.getAttribute('href') || a.href || '';
    if (href) {
      var normalized = normalizeImageUrl(href);
      a.setAttribute('href', normalized);
    }
  });

  return temp.innerHTML;
}

function renderPrompts() {
  var container = document.getElementById('prompts-container');
  container.innerHTML = '';
  
  // Remove all view mode classes
  container.classList.remove('view-grid', 'view-list');
  
  var filteredPrompts = filterItems(allPrompts, searchTermPrompts);
  
  // Get all Level 2 items for grid/list view
  var allLevel2Items = filteredPrompts.filter(function(p) { return p.level === 2; });
  
  // If grid or list view, render only Level 2 items
  if (promptsViewMode === 'grid' || promptsViewMode === 'list') {
    if (allLevel2Items.length === 0) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Không tìm thấy prompt</p></div>';
      return;
    }
    
    // Add view mode class
    container.classList.add('view-' + promptsViewMode);
    
    // Sort: isPinned DESC → order ASC
    allLevel2Items.sort(function(a, b) {
      var aPinned = a.isPinned ? 1 : 0;
      var bPinned = b.isPinned ? 1 : 0;
      if (aPinned !== bPinned) return bPinned - aPinned; // Pinned first
      return a.order - b.order;
    });
    
    // Render all Level 2 items
    allLevel2Items.forEach(function(item) {
      var card = renderPromptCard(item, filteredPrompts);
      container.appendChild(card);
    });
    
    // Initialize lazy loading for images rendered in prompts
    setupLazyLoadImages();
    return;
  }
  
  // Tree view - original logic
  var level0Prompts = filteredPrompts.filter(function(p) { return p.level === 0; });
  
  if (level0Prompts.length === 0) {
    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Không tìm thấy prompt</p></div>';
    return;
  }
  
  // Sort: isPinned DESC → order ASC (chỉ trong cùng level 0)
  level0Prompts.sort(function(a, b) {
    var aPinned = a.isPinned ? 1 : 0;
    var bPinned = b.isPinned ? 1 : 0;
    if (aPinned !== bPinned) return bPinned - aPinned; // Pinned first
    return a.order - b.order;
  });
  
  level0Prompts.forEach(function(level0Prompt) {
    var level0Box = renderPromptLevel0(level0Prompt, filteredPrompts);
    container.appendChild(level0Box);
  });
  // Initialize lazy loading for images rendered in prompts
  setupLazyLoadImages();
}

// Render Level 0 - Tiêu đề cấp 1 (Large Box)
function renderPromptLevel0(level0Prompt, allItems) {
  var level0Box = document.createElement('div');
  level0Box.className = 'note-level-0';
  level0Box.setAttribute('data-id', level0Prompt.id);
  
  var isCollapsed = collapsedPrompts[level0Prompt.id] === true;
  
  // Header
  var header = document.createElement('div');
  header.className = 'note-level-0-header';
  header.innerHTML = 
    '<div class="note-level-0-title">' +
    '<i class="fas fa-folder"></i>' +
    '<span>' + escapeHtml(level0Prompt.title || 'Untitled') + '</span>' +
    '</div>' +
    '<div class="note-level-0-actions">' +
    '<button class="note-collapse-btn" onclick="togglePromptLevel0(\'' + level0Prompt.id + '\')">' +
    (isCollapsed ? 'Phóng to' : 'Thu nhỏ') +
    '</button>' +
    '<div class="item-actions">' +
    '<i class="fas fa-thumbtack ' + (level0Prompt.isPinned ? 'pinned' : '') + '" onclick="togglePin(\'prompts\', \'' + level0Prompt.id + '\', event)" title="Ghim"></i>' +
    '<i class="fas fa-eye" onclick="viewItemContent(\'prompts\', \'' + level0Prompt.id + '\')"></i>' +
    '<i class="fas fa-copy" onclick="copyItemText(\'prompts\', \'' + level0Prompt.id + '\')"></i>' +
    '<i class="fas fa-edit" onclick="editItem(\'prompts\', \'' + level0Prompt.id + '\')"></i>' +
    '<i class="fas fa-plus" onclick="addChildItem(\'prompts\', \'' + level0Prompt.id + '\')"></i>' +
    '<i class="fas fa-trash" onclick="deleteItemConfirm(\'prompts\', \'' + level0Prompt.id + '\')"></i>' +
    '</div>' +
    '</div>';
  level0Box.appendChild(header);
  
  // Content (Level 1 groups)
  var content = document.createElement('div');
  content.className = 'note-level-0-content' + (isCollapsed ? ' collapsed' : '');
  
  // Get Level 1 items (children of Level 0)
  var level1Items = allItems.filter(function(p) { 
    return p.parentId === level0Prompt.id && p.level === 1; 
  });
  // Sort: isPinned DESC → order ASC (chỉ trong cùng parentId + level)
  level1Items.sort(function(a, b) {
    var aPinned = a.isPinned ? 1 : 0;
    var bPinned = b.isPinned ? 1 : 0;
    if (aPinned !== bPinned) return bPinned - aPinned; // Pinned first
    return a.order - b.order;
  });
  
  if (level1Items.length > 0) {
    level1Items.forEach(function(level1Item) {
      var level1Group = renderPromptLevel1(level1Item, allItems);
      content.appendChild(level1Group);
    });
  } else {
    // If no Level 1, check if there are Level 2 items directly under Level 0
    var directLevel2Items = allItems.filter(function(p) { 
      return p.parentId === level0Prompt.id && p.level === 2; 
    });
    
    if (directLevel2Items.length > 0) {
      // Create a default Level 1 group for Level 2 items

  container.classList.remove('view-grid', 'view-list');
  
  // Lọc bỏ items đã bị xóa
  var activeNotes = filterDeletedItems(allNotes);
  var filteredNotes = filterItems(activeNotes, searchTermNotes);
  
  // Get all Level 2 items for grid/list view
  var allLevel2Items = filteredNotes.filter(function(n) { return n.level === 2; });
  
  // If grid or list view, render only Level 2 items

      container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Không tìm thấy ghi chú</p></div>';

    allLevel2Items.sort(function(a, b) {

      return a.order - b.order;

    allLevel2Items.forEach(function(item) {

      container.appendChild(card);

// Mask password: show first 2 and last 2 chars, hide middle with ****
function toggleDataInTable(icon) {
  var row = icon.closest('tr');
  var cell = icon.closest('td');
  var dataSpan = cell.querySelector('.data-display');
  var dataType = dataSpan.getAttribute('data-type');
  var actualData = row.getAttribute('data-' + dataType);
  var isVisible = dataSpan.getAttribute('data-visible') === 'true';
  
  if (isVisible) {
    dataSpan.textContent = maskText(actualData, dataType);
    dataSpan.setAttribute('data-visible', 'false');
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  } else {
    dataSpan.textContent = actualData;
    dataSpan.setAttribute('data-visible', 'true');
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  }
}

function maskText(text, type) {
  if (!text) return '-';
  if (text.length <= 4) return '****';
  
  var first = text.substring(0, 2);
  var last = text.substring(text.length - 2);
  var middle = '****';
  
  return first + middle + last;
}

// Toggle password visibility in table
function togglePasswordInTable(icon) {
  var row = icon.closest('tr');
  var passwordSpan = row.querySelector('.password-display');
  var actualPassword = row.getAttribute('data-password');
  var isVisible = passwordSpan.getAttribute('data-visible') === 'true';
  
  if (isVisible) {
    passwordSpan.textContent = toggleDataInTable(actualPassword);
    passwordSpan.setAttribute('data-visible', 'false');
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  } else {
    passwordSpan.textContent = actualPassword;
    passwordSpan.setAttribute('data-visible', 'true');
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  }
}

// ===== FILTERING =====
function filterItems(items, searchTerm) {
  if (!searchTerm) return items;
  
  var matchedIds = []; // ← THÊM
  
  // If searchTerm starts with '#', perform tag search
  if (searchTerm.charAt(0) === '#') {
    var tag = searchTerm.substring(1).toLowerCase();
    if (!tag) return items;
    items.forEach(function(item) {
      var tagsStr = (item.tags || '').toString().toLowerCase();
      var tagsArr = tagsStr ? tagsStr.split(',') : [];
      if (tagsArr.indexOf(tag) !== -1) {
        matchedIds.push(item.id);
        var currentParentId = item.parentId;
        while (currentParentId) {
          if (matchedIds.indexOf(currentParentId) === -1) {
            matchedIds.push(currentParentId);
          }
          var parent = items.find(function(i) { return i.id === currentParentId; });
          currentParentId = parent ? parent.parentId : null;
        }
      }
    });
  } else {
    // Tìm các items match search term in title/content/etc.
    items.forEach(function(item) {
      var searchableText = (item.title || '') + ' ' + 
                          (item.content || '') + ' ' + 
                          (item.username || '') + ' ' +
                          (item.accountType || '') + ' ' +
                          (item.notes || '');
      if (searchableText.toLowerCase().indexOf(searchTerm) !== -1) {
        matchedIds.push(item.id);
        // Nếu match, thêm luôn tất cả parent
        var currentParentId = item.parentId;
        while (currentParentId) {
          if (matchedIds.indexOf(currentParentId) === -1) {
            matchedIds.push(currentParentId);
          }
          var parent = items.find(function(i) { return i.id === currentParentId; });
          currentParentId = parent ? parent.parentId : null;
        }
      }
    });
  }
  
  // ← THAY ĐỔI: Return items có ID trong matchedIds
  return items.filter(function(item) {
    return matchedIds.indexOf(item.id) !== -1;
  });
}

// Normalize tags on client: lowercase, trim, split/join, unique
function normalizeTagsClient(tags) {
  if (!tags && tags !== 0) return '';
  var arr = [];
  try {
    arr = tags.toString().split(',');
  } catch (e) {
    return '';
  }
  var seen = {};
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var t = (arr[i] || '').toString().toLowerCase().trim();
    if (!t) continue;
    if (t.charAt(0) === '#') t = t.substring(1);
    if (!t) continue;
    if (!seen[t]) {
      seen[t] = true;
      out.push(t);
    }
  }
  return out.join(',');
}

// Apply tag filter when clicking a tag chip
function applyTagFilter(type, tag) {
  if (!tag) return;
  tag = tag.toString().toLowerCase().trim();
  if (!tag) return;
  if (type === 'prompts') {
    searchTermPrompts = '#' + tag;
    var input = document.getElementById('search-prompts');
    if (input) input.value = '#' + tag;
    renderPrompts();
  } else if (type === 'notes') {
    searchTermNotes = '#' + tag;
    var input2 = document.getElementById('search-notes');
    if (input2) input2.value = '#' + tag;
    renderNotes();
  }
}

  var title = form.querySelector('[name="title"]').value.trim();

  tags = normalizeTagsClient(tags);
  
  if (!title) {
    showNotification('Vui lòng nhập tiêu đề', 'error');

      level: calculateLevel(allPrompts, parentId), // THAY ĐỔI Ở ĐÂY
      order: getNextOrder(allPrompts, parentId)
    };

}

async function saveAccount() {
  var form = document.getElementById('form-account');
  var itemId = form.getAttribute('data-id');
  var parentId = form.getAttribute('data-parent-id') || '';
  var parentAccountType = form.getAttribute('data-parent-account-type') || '';
  var currentAccountType = form.getAttribute('data-current-account-type') || '';
  
  var accountType = form.querySelector('[name="accountType"]').value.trim();
  var username = form.querySelector('[name="username"]').value.trim();
  var password = form.querySelector('[name="password"]').value.trim();
  var phone = form.querySelector('[name="phone"]').value.trim();
  var notes = htmlToMarkdown(document.getElementById('account-notes').innerHTML);
  
  // If adding/editing child item, use parent's or current account type
  if (parentId && parentAccountType) {
    accountType = parentAccountType; 
  } else if (itemId && currentAccountType) {
    accountType = currentAccountType; 
  }
  
  // Validation
  if (parentId && !itemId) {
    // Adding child account: need username and password >= 6 chars
    if (!username) {
      showNotification('Vui lòng nhập tên đăng nhập', 'error');
      return;
    }
    if (!password) {
      showNotification('Vui lòng nhập mật khẩu', 'error');
      return;
    }
    if (password.length < 6) {
      showNotification('Mật khẩu phải có ít nhất 6 ký tự', 'error');
      return;
    }
  } else if (!itemId) {
    // Adding root account (group): only need accountType
    if (!accountType) {
      showNotification('Vui lòng nhập loại tài khoản', 'error');
      return;
    }
  } else {
    // Editing: if password is provided, check minimum length
    if (password && password.length < 6) {
      showNotification('Mật khẩu phải có ít nhất 6 ký tự', 'error');
      return;
    }
  }
  
  closeModal();
  
  if (itemId) {
    await updateItemOptimistic('accounts', itemId, {
      accountType: accountType,
      username: username,
      password: password,
      phone: phone,
      notes: notes
    });
  } else {
    // var now = new Date().toISOString();
    var newItem = {
      id: 'A' + Date.now(),
      parentId: parentId,
      accountType: accountType,
      username: username,
      password: password,
      phone: phone,
      notes: notes,
      level: calculateLevel(allAccounts, parentId),
      order: getNextOrder(allAccounts, parentId)
      // createdAt: now,
      // updatedAt: now
    };
    await createItemOptimistic('accounts', newItem);
  }
}

// Copy item text to clipboard
function copyItemText(type, itemId) {
  var items = type === 'prompts' ? allPrompts : 
              (type === 'notes' ? allNotes : 
              (type === 'tasks' ? allTasks : allAccounts));
  var item = items.find(function(i) { return i.id === itemId; });
  
  if (!item) return;
  
  var textToCopy = '';
  
  if (type === 'accounts') {
    var parts = [];
    if (item.accountType) parts.push(item.accountType);
    if (item.username) parts.push(item.username);
    if (item.password) parts.push(item.password);
    if (item.phone) parts.push(item.phone);
    if (item.notes) parts.push(item.notes);
    textToCopy = parts.join('\n');
  } else {
    // For prompts, notes, tasks: only copy content
    textToCopy = item.content || '';
  }
  
  if (!textToCopy) {
    showNotification('Không có nội dung để sao chép', 'error');
    return;
  }
  
  // Modern clipboard API
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textToCopy).then(function() {
      showNotification('Đã sao chép vào clipboard!', 'success');
    }).catch(function(err) {
      fallbackCopyText(textToCopy);
    });
  } else {
    fallbackCopyText(textToCopy);
  }
}

// Fallback copy method for older browsers
function fallbackCopyText(text) {
  var textArea = document.createElement('textarea');
  textArea.value = text;
  textArea.style.position = 'fixed';
  textArea.style.left = '-999999px';
  textArea.style.top = '-999999px';
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  
  try {
    var successful = document.execCommand('copy');
    if (successful) {
      showNotification('Đã sao chép vào clipboard!', 'success');
    } else {
      showNotification('Không thể sao chép', 'error');
    }
  } catch (err) {
    showNotification('Không thể sao chép', 'error');
  }
  
  document.body.removeChild(textArea);
}

// ===== OPTIMISTIC UPDATES =====
async function createItemOptimistic(type, item) {
  // Optimistic UI update
  if (type === 'prompts') {
    allPrompts.push(item);
  } else if (type === 'notes') {
    allNotes.push(item);
  } else if (type === 'tasks') {
    allTasks.push(item);
  } else {
    allAccounts.push(item);
  }
  
  renderCurrentTab();
  showNotification('Đang tạo...', 'info');
  
  // Simulate delay
  await sleep(1500);
  
  // Sync with server
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          showNotification('Tạo thành công', 'success');
          resolve();
        } else {
          showNotification('Lỗi: ' + result.error, 'error');
          reject();
        }
      })
      .withFailureHandler(function(error) {
        showNotification('Lỗi: ' + error.message, 'error');
        reject();
      })
      .createItem(capitalizeFirst(type), item);
  });
}

async function updateItemOptimistic(type, itemId, updates) {
  // Optimistic UI update
  var items = type === 'prompts' ? allPrompts : 
              (type === 'notes' ? allNotes : 
              (type === 'tasks' ? allTasks : allAccounts));
  var item = items.find(function(i) { return i.id === itemId; });
  
  if (item) {
    Object.keys(updates).forEach(function(key) {
      if (key === 'tags') {
        item[key] = normalizeTagsClient(updates[key] || '');
      } else {
        item[key] = updates[key];
      }
    });
    item.updatedAt = new Date().toISOString();
  }
  
  renderCurrentTab();
  showNotification('Đang cập nhật...', 'info');
  
  // Simulate delay
  await sleep(1500);
  
  // Sync with server
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          showNotification('Cập nhật thành công', 'success');
          resolve();
        } else {
          showNotification('Lỗi: ' + result.error, 'error');
          reject();
        }
      })
      .withFailureHandler(function(error) {
        showNotification('Lỗi: ' + error.message, 'error');
        reject();
      })
      .updateItem(capitalizeFirst(type), itemId, updates);
  });
}

    if (toggleBtn) {
      toggleBtn.className = 'fas fa-' + (quickViewCollapsed[itemId] ? 'chevron-down' : 'chevron-up');
    }
  }
}

// Toggle Pin - Chỉ re-render tab hiện tại, không re-render toàn app
async function togglePin(type, itemId, event) {
  if (event) {
    event.stopPropagation();
    event.preventDefault();
  }
  
  var items = type === 'prompts' ? allPrompts : allNotes;
  var item = items.find(function(i) { return i.id === itemId; });
  
  if (!item) return;
  
  // Toggle pin state
  var newPinState = !item.isPinned;
  item.isPinned = newPinState;
  
  // Optimistic UI update - chỉ re-render tab hiện tại
  if ((type === 'prompts' && currentTab === 'prompts') || 
      (type === 'notes' && currentTab === 'notes')) {
    renderCurrentTab();
  }
  
  // Sync with server
  await updateItemOptimistic(type, itemId, { isPinned: newPinState });
  
  showNotification(newPinState ? 'Đã ghim' : 'Đã bỏ ghim', 'success');
}

// Filter deleted items recursively (nếu parent bị xóa thì ẩn cả children)
function filterDeletedItems(items) {
  if (!items || items.length === 0) return [];
  
  // Tạo map để tìm nhanh
  var itemMap = {};
  items.forEach(function(item) {
    itemMap[item.id] = item;
  });
  
  // Hàm kiểm tra item có bị xóa không (bao gồm cả parent)
  function isItemDeleted(item) {
    if (!item) return true;
    if (item.isDeleted) return true;
    // Nếu có parent, kiểm tra parent có bị xóa không
    if (item.parentId && itemMap[item.parentId]) {
      return isItemDeleted(itemMap[item.parentId]);
    }
    return false;
  }
  
  // Lọc bỏ items đã bị xóa
  return items.filter(function(item) {
    return !isItemDeleted(item);
  });
}

async function deleteItemOptimistic(type, itemId) {
  // Soft Delete: Set isDeleted = true thay vì xóa khỏi mảng
  var items = type === 'prompts' ? allPrompts : 
              (type === 'notes' ? allNotes : 
              (type === 'tasks' ? allTasks : allAccounts));
  
  // Tìm item và set isDeleted = true
  var item = items.find(function(i) { return i.id === itemId; });
  if (item) {
    item.isDeleted = true;
    
    // Set isDeleted cho tất cả children (đệ quy)
    function markChildrenAsDeleted(parentId) {
      items.forEach(function(i) {
        if (i.parentId === parentId && !i.isDeleted) {
          i.isDeleted = true;
          markChildrenAsDeleted(i.id);
        }
      });
    }
    markChildrenAsDeleted(itemId);
  }
  
  renderCurrentTab();
  showNotification('Đã chuyển vào thùng rác', 'info');
  
  // Simulate delay
  await sleep(1500);
  
  // Sync with server
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          showNotification('Xóa thành công', 'success');
          resolve();
        } else {
          showNotification('Lỗi: ' + result.error, 'error');
          reject();
        }
      })
      .withFailureHandler(function(error) {
        showNotification('Lỗi: ' + error.message, 'error');
        reject();
      })
      .deleteItem(capitalizeFirst(type), itemId);
  });
}

// ===== HELPER FUNCTIONS =====
function removeItemAndChildren(items, itemId) {
  var idsToRemove = [itemId];
  var toProcess = [itemId];
  
  while (toProcess.length > 0) {
    var currentId = toProcess.pop();
    var children = items.filter(function(i) { return i.parentId === currentId; });
    children.forEach(function(child) {
      idsToRemove.push(child.id);
      toProcess.push(child.id);
    });
  }
  
  return items.filter(function(i) { return idsToRemove.indexOf(i.id) === -1; });
}

function calculateLevel(items, parentId) {
  if (!parentId) return 0;
  var parent = items.find(function(i) { return i.id === parentId; });
  return parent ? parent.level + 1 : 0;
}

function getNextOrder(items, parentId) {
  var siblings = items.filter(function(i) { return i.parentId === parentId; });
  if (siblings.length === 0) return 1;
  return Math.max.apply(null, siblings.map(function(s) { return s.order; })) + 1;
}

function capitalizeFirst(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function escapeHtml(text) {
  if (!text) return '';
  var map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}

function sleep(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

// ===== TEXT FORMATTING =====
function setupTextFormatting(editorId) {
  var editor = document.getElementById(editorId);
  if (!editor) return;
  
  // Check if already setup to avoid duplicate listeners
  if (editor.hasAttribute('data-formatting-setup')) return;
  editor.setAttribute('data-formatting-setup', 'true');
  
  // Keyboard shortcuts
  editor.addEventListener('keydown', function(e) {
    // Ctrl+B - Bold
    if (e.ctrlKey && e.key === 'b') {
      e.preventDefault();
      document.execCommand('bold', false, null);
    }
    // Ctrl+I - Italic
    if (e.ctrlKey && e.key === 'i') {
      e.preventDefault();
      document.execCommand('italic', false, null);
    }
    // Ctrl+Z - Undo
    if (e.ctrlKey && e.key === 'z') {
      e.preventDefault();
      undoTableAction(editor);
    }
  });
  
  // Right-click on table cells
  editor.addEventListener('contextmenu', function(e) {
    var cell = e.target.closest('td, th');
    if (cell) {
      e.preventDefault();
      showTableContextMenu(e, cell);
    }
  });

  // Drag and drop for images
  editor.addEventListener('dragstart', function(e) {
    if (e.target.closest('.image-wrapper')) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', e.target.closest('.image-wrapper').outerHTML);
      e.target.closest('.image-wrapper').classList.add('dragging');
    }
  });

  editor.addEventListener('dragover', function(e) {
    e.preventDefault();
    var wrapper = e.target.closest('.image-wrapper');
    if (wrapper && !wrapper.classList.contains('dragging')) {
      var row = wrapper.parentElement;
      var dragging = row.querySelector('.dragging');
      if (dragging) {
        var rect = wrapper.getBoundingClientRect();
        var after = e.clientX > rect.left + rect.width / 2;
        row.insertBefore(dragging, after ? wrapper.nextSibling : wrapper);
      }
    }
  });

  editor.addEventListener('dragend', function(e) {
    var dragging = editor.querySelector('.dragging');
    if (dragging) dragging.classList.remove('dragging');
  });
}

// Convert Markdown to HTML for display
function markdownToHtml(text) {
  if (!text) return '';
  
  // Check if text contains HTML table or images
  if (text.indexOf('<table') !== -1 || text.indexOf('[IMG]') !== -1) {
    // Contains table/images, process mixed content
    var parts = text.split(/(<table[\s\S]*?<\/table>|\[IMG\][\s\S]*?\[\/IMG\])/);
    var result = '';
    
    parts.forEach(function(part, index) {
      if (part.indexOf('<table') === 0) {
        // It's a table
        result += part;
      } else if (part.indexOf('[IMG]') === 0) {
        // It's images, convert to HTML
        var urls = part.replace('[IMG]', '').replace('[/IMG]', '').trim().split('\n').filter(function(u) { return u.trim(); });
        
        // ← THÊM: Check if previous/next part has content
        var prevPart = parts[index - 1] || '';
        var nextPart = parts[index + 1] || '';
        var hasContentBefore = prevPart.trim().length > 0;
        var hasContentAfter = nextPart.trim().length > 0;
        
        // Add empty paragraph before if needed
        if (!hasContentBefore && index > 0) {
          result += '<p><br></p>';
        }
        
        result += '<div class="image-row" contenteditable="false">';
        urls.forEach(function(url) {
          url = url.trim();
          // KHÔNG normalize khi render - URL sẽ được normalize khi click
          result += '<div class="image-wrapper" draggable="true">' +
            '<img src="' + url + '" data-url="' + url + '" loading="lazy" onclick="openImageUrl(this)"/>' +
            '<div class="btn-remove" onclick="removeImageWrapper(this)">×</div>' +
            '</div>';
        });
        result += '<div class="btn-add-image" onclick="addMoreImages(this)">' +
          '<i class="fas fa-plus"></i> Thêm' +
          '</div></div>';
        
        // Add empty paragraph after if needed
        if (!hasContentAfter && index < parts.length - 1) {
          result += '<p><br></p>';
        }
      } else {
        // It's text, process markdown
        if (part.trim()) {
          part = escapeHtml(part);
          part = part.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          part = part.replace(/\*(.*?)\*/g, '<em>$1</em>');
          part = part.replace(/\n/g, '<br>');
          result += part;
        }
      }
    });
    
    return result;
  } else {
    // No table, normal processing
    text = escapeHtml(text);
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    text = text.replace(/\n/g, '<br>');
    return text;
  }
}

function htmlToMarkdown(html) {
  if (!html) return '';
  
  var temp = document.createElement('div');
  temp.innerHTML = html;
  
  // EXTRACT tables và images
  var preservedBlocks = {};
  var blockCounter = 0;
  
  // Extract tables
  temp.querySelectorAll('table').forEach(function(table) {
    var marker = '%%BLOCK_' + blockCounter + '%%';
    preservedBlocks[marker] = table.outerHTML;
    table.outerHTML = marker;
    blockCounter++;
  });
  
  // Extract images
  temp.querySelectorAll('.image-row').forEach(function(row) {
    var urls = [];
    row.querySelectorAll('img').forEach(function(img) {
      urls.push(img.src);
    });
    var marker = '%%BLOCK_' + blockCounter + '%%';
    preservedBlocks[marker] = '[IMG]\n' + urls.join('\n') + '\n[/IMG]';
    row.outerHTML = marker;
    blockCounter++;
  });
  
  // Convert HTML to text
  temp.querySelectorAll('strong, b').forEach(function(el) {
    el.outerHTML = '**' + el.textContent + '**';
  });
  
  temp.querySelectorAll('em, i').forEach(function(el) {
    el.outerHTML = '*' + el.textContent + '*';
  });
  
  temp.querySelectorAll('div').forEach(function(el) {
    el.outerHTML = '\n' + el.innerHTML;
  });
  
  temp.querySelectorAll('p').forEach(function(el) {
    el.outerHTML = el.innerHTML + '\n';
  });
  
  temp.querySelectorAll('br').forEach(function(el) {
    el.outerHTML = '\n';
  });
  
  var text = temp.textContent || temp.innerText;
  
  // Restore preserved blocks
  Object.keys(preservedBlocks).forEach(function(marker) {
    text = text.replace(marker, preservedBlocks[marker]);
  });
  
  // ← CLEAN UP: loại bỏ empty lines thừa quanh blocks
  text = text.replace(/\n{3,}/g, '\n\n'); // Max 2 newlines
  text = text.replace(/^\n+/, ''); // Remove leading newlines
  text = text.replace(/\n+$/, ''); // Remove trailing newlines
  
  return text.trim();
}

function wrapSelectedText(textarea, before, after) {
  var start = textarea.selectionStart;
  var end = textarea.selectionEnd;
  var selectedText = textarea.value.substring(start, end);
  
  if (!selectedText) return;
  
  var wrappedText = before + selectedText + after;
  textarea.value = textarea.value.substring(0, start) + wrappedText + textarea.value.substring(end);
  
  // Restore selection
  textarea.selectionStart = start + before.length;
  textarea.selectionEnd = end + before.length;
  textarea.focus();
}

function parseMarkdown(text) {
  // Bold: **text** -> <strong>text</strong>
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Italic: *text* -> <em>text</em>
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  return text;
}

// Table actions
function tableAction(action) {
  if (!currentTableCell) return;
  
  var cell = currentTableCell;
  var row = cell.parentElement;
  var table = cell.closest('table');
  var tbody = table.querySelector('tbody');
  var cellIndex = Array.from(row.children).indexOf(cell);
  var rowIndex = Array.from(tbody.children).indexOf(row);
  
  // Save state before action for undo
  var undoState = {
    editorId: table.closest('.content-editor').id,
    tableHTML: table.outerHTML,
    action: action
  };
  
  switch(action) {
    case 'addRowAbove':
      var newRow = row.cloneNode(true);
      Array.from(newRow.children).forEach(function(td) {
        td.innerHTML = '<br>';
      });
      tbody.insertBefore(newRow, row);
      showNotification('Đã thêm hàng phía trên (Ctrl+Z để hoàn tác)', 'success');
      tableUndoHistory.push(undoState);
      break;
      
    case 'addRowBelow':
      var newRow = row.cloneNode(true);
      Array.from(newRow.children).forEach(function(td) {
        td.innerHTML = '<br>';
      });
      if (row.nextSibling) {
        tbody.insertBefore(newRow, row.nextSibling);
      } else {
        tbody.appendChild(newRow);
      }
      showNotification('Đã thêm hàng phía dưới (Ctrl+Z để hoàn tác)', 'success');
      tableUndoHistory.push(undoState);
      break;
      
    case 'deleteRow':
      if (tbody.children.length <= 2) {
        showNotification('Không thể xóa hàng cuối cùng', 'error');
        return;
      }
      tbody.removeChild(row);
      showNotification('Đã xóa hàng (Ctrl+Z để hoàn tác)', 'success');
      tableUndoHistory.push(undoState);
      break;
      
    case 'addColLeft':
      Array.from(tbody.children).forEach(function(r, idx) {
        var newCell = idx === 0 ? document.createElement('th') : document.createElement('td');
        newCell.innerHTML = idx === 0 ? 'Cột mới' : '<br>';
        r.insertBefore(newCell, r.children[cellIndex]);
      });
      showNotification('Đã thêm cột bên trái (Ctrl+Z để hoàn tác)', 'success');
      tableUndoHistory.push(undoState);
      break;
      
    case 'addColRight':
      Array.from(tbody.children).forEach(function(r, idx) {
        var newCell = idx === 0 ? document.createElement('th') : document.createElement('td');
        newCell.innerHTML = idx === 0 ? 'Cột mới' : '<br>';
        if (cellIndex + 1 < r.children.length) {
          r.insertBefore(newCell, r.children[cellIndex + 1]);
        } else {
          r.appendChild(newCell);
        }
      });
      showNotification('Đã thêm cột bên phải (Ctrl+Z để hoàn tác)', 'success');
      tableUndoHistory.push(undoState);
      break;
      
    case 'deleteCol':
      if (row.children.length <= 1) {
        showNotification('Không thể xóa cột cuối cùng', 'error');
        return;
      }
      Array.from(tbody.children).forEach(function(r) {
        if (r.children[cellIndex]) {
          r.removeChild(r.children[cellIndex]);
        }
      });
      showNotification('Đã xóa cột (Ctrl+Z để hoàn tác)', 'success');
      tableUndoHistory.push(undoState);
      break;
      
    case 'deleteTable':
      if (confirm('Bạn có chắc chắn muốn xóa bảng này?')) {
        table.remove();
        showNotification('Đã xóa bảng (Ctrl+Z để hoàn tác)', 'success');
        tableUndoHistory.push(undoState);
      }
      break;
  }
  
  // Limit undo history to last 20 actions
  if (tableUndoHistory.length > 20) {
    tableUndoHistory.shift();
  }
  
  // Hide menu
  document.getElementById('table-context-menu').style.display = 'none';
  currentTableCell = null;
}

// Undo table action
function undoTableAction(editor) {
  if (tableUndoHistory.length === 0) {
    showNotification('Không có thao tác để hoàn tác', 'info');
    return;
  }
  
  var lastState = tableUndoHistory.pop();
  
  // Find the table in editor
  var tables = editor.querySelectorAll('table');
  var targetTable = null;
  
  // If table was deleted, we need to restore it
  if (lastState.action === 'deleteTable') {
    editor.innerHTML += lastState.tableHTML;
    showNotification('Đã hoàn tác xóa bảng', 'success');
    return;
  }
  
  // For other actions, find and replace the modified table
  if (tables.length > 0) {
    targetTable = tables[tables.length - 1]; // Get last table (most recently modified)
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = lastState.tableHTML;
    var restoredTable = tempDiv.querySelector('table');
    
    if (targetTable && restoredTable) {
      targetTable.parentNode.replaceChild(restoredTable, targetTable);
      showNotification('Đã hoàn tác', 'success');
    }
  }
}

// Insert images
function insertImages(editorId) {

  // ← LƯU CURSOR POSITION
  editor.focus();

  }

function insertImagesFromModal() {
  var form = document.getElementById('form-insert-images');
  var editorId = form.getAttribute('data-editor-id');
  var urls = document.getElementById('image-urls').value.trim();
  
  if (!urls) {
    showNotification('Vui lòng nhập ít nhất 1 URL', 'error');
    return;
  }
  
  var editor = document.getElementById(editorId);
  var urlList = urls.split('\n').filter(function(u) { return u.trim(); });
  
  // Convert Drive URLs
  // Normalize and convert Drive URLs to lh3 where possible
  var processedUrls = urlList.map(function(url) {
    url = url.trim();
    return normalizeImageUrl(url);
  });
  
  // Create image row HTML
  var imageHTML = '<div class="image-row" contenteditable="false">';
  processedUrls.forEach(function(url) {
    // Use data-src for lazy loading and a tiny placeholder for src
    var placeholder = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
    imageHTML += '<div class="image-wrapper" draggable="true">' +
      '<img src="' + placeholder + '" data-src="' + url + '" data-url="' + url + '" loading="lazy" onclick="openImageUrl(this)" onerror="this.onerror=null;handleImageError(this);"/>' +
      '<div class="btn-remove" onclick="removeImageWrapper(this)">×</div>' +
      '</div>';
  });
  imageHTML += '<div class="btn-add-image" onclick="addMoreImages(this)">' +
    '<i class="fas fa-plus"></i> Thêm' +
    '</div></div>';
  
  document.getElementById('modal-insert-images').style.display = 'none';
  document.getElementById('image-urls').value = '';
  
  editor.focus();
  
  if (savedSelection) {
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
    
    var range = savedSelection;
    
    // ← CHECK CONTEXT: có content trước/sau không?
    var beforeNode = range.startContainer;
    var afterNode = range.endContainer;
    
    var hasContentBefore = false;
    var hasContentAfter = false;
    
    // Check before
    if (beforeNode.nodeType === Node.TEXT_NODE && beforeNode.textContent.trim()) {
      hasContentBefore = true;
    } else if (beforeNode.previousSibling && beforeNode.previousSibling.textContent && beforeNode.previousSibling.textContent.trim()) {
      hasContentBefore = true;
    }
    
    // Check after
    if (afterNode.nodeType === Node.TEXT_NODE && afterNode.textContent.trim()) {
      hasContentAfter = true;
    } else if (afterNode.nextSibling && afterNode.nextSibling.textContent && afterNode.nextSibling.textContent.trim()) {
      hasContentAfter = true;
    }
    
    // Thêm <p><br></p> nếu cần
    var finalHTML = '';
    if (!hasContentBefore) {
      finalHTML += '<p><br></p>';
    }
    finalHTML += imageHTML;
    if (!hasContentAfter) {
      finalHTML += '<p><br></p>';
    }
    
    var fragment = range.createContextualFragment(finalHTML);
    range.deleteContents();
    range.insertNode(fragment);
    
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
    
    savedSelection = null;
  } else {
    // Fallback: check if editor is empty
    var editorEmpty = !editor.textContent.trim();
    if (editorEmpty) {
      editor.innerHTML = '<p><br></p>' + imageHTML + '<p><br></p>';
    } else {
      editor.innerHTML += imageHTML + '<p><br></p>';
    }
  }
  
  showNotification('Đã thêm ' + processedUrls.length + ' hình', 'success');
  // Initialize lazy loader for newly inserted images
  setupLazyLoadImages();
}

// Add from modal
function addMoreImagesFromModal() {

  if (!urls) {
    showNotification('Vui lòng nhập ít nhất 1 URL', 'error');

  // Process URLs
  var processedUrls = urlList.map(function(url) {
    url = url.trim();
    var driveMatch = url.match(/d\/([^/]+)/);
    if (driveMatch) {
      return 'https://drive.google.com/thumbnail?id=' + driveMatch[1];
    }
    return url;
  });
  
  // Find "Add" button
  var addBtn = row.querySelector('.btn-add-image');

      '<div class="btn-remove" onclick="removeImageWrapper(this)">×</div>';
    row.insertBefore(wrapper, addBtn);
  });
  
  // Close modal
  document.getElementById('modal-add-more-images').style.display = 'none';
  window.currentImageRow = null;
  
  showNotification('Đã thêm ' + processedUrls.length + ' hình', 'success');

function setupDragAndDrop() {
  document.addEventListener('dragstart', handleDragStart);
  document.addEventListener('dragover', handleDragOver);
  document.addEventListener('drop', handleDrop);
  document.addEventListener('dragend', handleDragEnd);
}

function handleDragStart(e) {
  var target = e.target.closest('.prompt-card, .task-item');
  if (!target) return;
  
  draggedItem = target;
  e.dataTransfer.effectAllowed = 'move';
  target.style.opacity = '0.4';
  
  var siblings = Array.from(target.parentElement.children).filter(function(el) {
    return el.classList.contains('prompt-card') || el.classList.contains('task-item');
  });
  originalIndex = siblings.indexOf(target);
  
  draggedParentId = target.getAttribute('data-id');
}

function handleDragOver(e) {
  if (!draggedItem) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  
  var target = e.target.closest('.prompt-card, .task-item');
  if (!target || target === draggedItem) return;
  
  var container = draggedItem.parentElement;
  var targetContainer = target.parentElement;
  
  if (container !== targetContainer) return;
  
  var rect = target.getBoundingClientRect();
  var after = e.clientY > rect.top + rect.height / 2;
  
  container.insertBefore(draggedItem, after ? target.nextSibling : target);
}

function handleDrop(e) {
  e.preventDefault();
  if (!draggedItem) return;
  
  // Check if position actually changed
  var siblings = Array.from(draggedItem.parentElement.children).filter(function(el) {
    return el.classList.contains('prompt-card') || el.classList.contains('task-item');
  });
  var newIndex = siblings.indexOf(draggedItem);
  
  // ← THÊM KIỂM TRA NÀY
  if (newIndex !== originalIndex) {
    // Update order in data only if position changed
    updateItemOrder();
  }
}

function handleDragEnd(e) {
  if (draggedItem) {
    draggedItem.style.opacity = '';
    draggedItem = null;
  }
  draggedParentId = null;
  originalIndex = -1; // ← THÊM DÒNG NÀY
}

function updateItemOrder() {
  var container = draggedItem.parentElement;
  var items = Array.from(container.children).filter(function(el) {
    return el.classList.contains('prompt-card') || el.classList.contains('task-item');
  });
  
  var tabType = currentTab;
  var dataArray = tabType === 'prompts' ? allPrompts : 
                  (tabType === 'notes' ? allNotes : 
                  (tabType === 'tasks' ? allTasks : allAccounts));
  
  items.forEach(function(item, index) {
    var itemId = item.getAttribute('data-id');
    var dataItem = dataArray.find(function(d) { return d.id === itemId; });
    if (dataItem) {
      dataItem.order = index + 1;
    }
  });
  
  if (tabType === 'tasks') {
    renderTasksCalendar();
  } else {
    renderCurrentTab();
  }
  
  syncOrderWithBackend(tabType, items);
  
  showNotification('Đã cập nhật thứ tự', 'success');
}

async function syncOrderWithBackend(tabType, items) {
  var sheetName = tabType === 'prompts' ? 'Prompts' : 
                  (tabType === 'notes' ? 'Notes' : 
                  (tabType === 'tasks' ? 'Tasks' : 'Accounts'));
  
  var updates = items.map(function(item, index) {
    return {
      id: item.getAttribute('data-id'),
      order: index + 1
    };
  });
  
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          resolve();
        } else {
          showNotification('Lỗi đồng bộ: ' + result.error, 'error');
          reject();
        }
      })
      .withFailureHandler(function(error) {
        showNotification('Lỗi: ' + error.message, 'error');
        reject();
      })
      .batchUpdateOrder(sheetName, updates);
  });
}

// ===== RECYCLE BIN =====
function renderRecycleBin() {
  var container = document.getElementById('recycle-container');
  container.innerHTML = '';

  // Collect deleted items in required order (no deep clone)
  var deletedItems = [];
  deletedItems = deletedItems.concat(allPrompts.filter(function(x) { return x.isDeleted; }));
  deletedItems = deletedItems.concat(allNotes.filter(function(x) { return x.isDeleted; }));
  deletedItems = deletedItems.concat(allAccounts.filter(function(x) { return x.isDeleted; }));
  deletedItems = deletedItems.concat(allTasks.filter(function(x) { return x.isDeleted; }));

  if (!deletedItems || deletedItems.length === 0) {
    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Thùng rác trống</p></div>';
    return;
  }

  // Render by type groups in the required order
  var createSection = function(title) {
    var sec = document.createElement('div');
    sec.className = 'recycle-section';
    var h = document.createElement('h4');
    h.textContent = title;
    sec.appendChild(h);
    return sec;
  };

  // Helper to render an item row
  var renderRow = function(item, sheetName, displayField, typeLabel) {
    var row = document.createElement('div');
    row.className = 'recycle-row';
    var left = document.createElement('div');
    left.className = 'recycle-left';
    left.innerHTML = '<strong>' + typeLabel + '</strong> <span class="muted">(' + sheetName + ')</span>';

    var displayValue = item[displayField] || '';
    var middle = document.createElement('div');
    middle.className = 'recycle-middle';
    middle.textContent = displayValue;

    var actions = document.createElement('div');
    actions.className = 'recycle-actions';

    var btnRestore = document.createElement('button');
    btnRestore.className = 'btn btn-secondary';
    btnRestore.textContent = '♻️ Restore';
    btnRestore.addEventListener('click', function() {
      // Update isDeleted = false via updateItem
      google.script.run
        .withSuccessHandler(function() {
          loadAllData().then(renderRecycleBin);
          showNotification('Đã khôi phục', 'success');
        })
        .withFailureHandler(function(err) {
          showNotification('Lỗi khi khôi phục: ' + (err && err.message ? err.message : err), 'error');
        })
        .updateItem(sheetName, item.id, { isDeleted: false });
    });

    var btnDelete = document.createElement('button');
    btnDelete.className = 'btn btn-primary';
    btnDelete.style.background = '#e94849';
    btnDelete.textContent = 'Xóa vĩnh viễn';
    btnDelete.addEventListener('click', function() {
      if (!confirm('Xóa vĩnh viễn? Không thể khôi phục.')) return;
      google.script.run
        .withSuccessHandler(function() {
          loadAllData().then(renderRecycleBin);
          showNotification('Đã xóa vĩnh viễn', 'success');
        })
        .withFailureHandler(function(err) {
          showNotification('Lỗi khi xóa: ' + (err && err.message ? err.message : err), 'error');
        })
        .deleteItemById(sheetName, item.id);
    });

    actions.appendChild(btnRestore);
    actions.appendChild(btnDelete);

    row.appendChild(left);
    row.appendChild(middle);
    row.appendChild(actions);
    return row;
  };

  // Sections in order: Prompts, Notes, Accounts, Tasks
  var promptsSection = createSection('Prompts');
  deletedItems.filter(function(i) { return allPrompts.indexOf(i) !== -1; }).forEach(function(item) {
    promptsSection.appendChild(renderRow(item, 'Prompts', 'title', 'Prompt'));
  });
  if (promptsSection.querySelectorAll('.recycle-row').length > 0) container.appendChild(promptsSection);

  var notesSection = createSection('Notes');
  deletedItems.filter(function(i) { return allNotes.indexOf(i) !== -1; }).forEach(function(item) {
    notesSection.appendChild(renderRow(item, 'Notes', 'title', 'Note'));
  });
  if (notesSection.querySelectorAll('.recycle-row').length > 0) container.appendChild(notesSection);

  var accountsSection = createSection('Accounts');
  deletedItems.filter(function(i) { return allAccounts.indexOf(i) !== -1; }).forEach(function(item) {
    accountsSection.appendChild(renderRow(item, 'Accounts', 'accountType', 'Account'));
  });
  if (accountsSection.querySelectorAll('.recycle-row').length > 0) container.appendChild(accountsSection);

  var tasksSection = createSection('Tasks');
  deletedItems.filter(function(i) { return allTasks.indexOf(i) !== -1; }).forEach(function(item) {
    tasksSection.appendChild(renderRow(item, 'Tasks', 'title', 'Task'));
  });
  if (tasksSection.querySelectorAll('.recycle-row').length > 0) container.appendChild(tasksSection);
}
